[project]
name = "database-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "mcp>=1.26.0",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.8.0",
]

[project.scripts]
database-mcp-server = "src.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
